version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: wwi-postgres
    environment:
      POSTGRES_USER: wwi_admin
      POSTGRES_PASSWORD: wwi_password
      POSTGRES_DB: wwi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
