version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: wwi-postgres
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
      POSTGRES_DB: asb_oltp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/sql/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql
    restart: unless-stopped

volumes:
  pgdata:
